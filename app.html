<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="auth-brand"><span class="mark"></span><h1>Roster</h1></div>

    <nav class="nav-group">
      <button class="nav-item active" data-view="roster"><span class="dot"></span>Spieler</button>
      <button class="nav-item" data-view="members" id="nav-members" style="display:none;"><span class="dot"></span>Mitglieder</button>
    </nav>

    <div class="sidebar-foot">
      <div class="who">
        <span class="name" id="who-name">—</span>
        <span class="badge" id="who-role">…</span>
      </div>
      <button id="btn-logout" class="btn btn-ghost btn-sm">Abmelden</button>
    </div>
  </aside>

  <main class="main">

    <!-- ROSTER VIEW -->
    <section id="view-roster" class="view active">
      <div class="view-head">
        <div>
          <h2>Spieler</h2>
          <p class="sub">Profile &amp; Leistungswerte des Teams.</p>
        </div>
        <button id="btn-add-player" class="btn btn-primary">+ Spieler hinzufügen</button>
      </div>

      <div id="msg-roster" class="msg"></div>
      <div id="roster-container"><p class="skeleton">Lade Spieler…</p></div>
    </section>

    <!-- MEMBERS VIEW (admin only) -->
    <section id="view-members" class="view">
      <div class="view-head">
        <div>
          <h2>Mitglieder</h2>
          <p class="sub">Konten &amp; Rollen der registrierten Nutzer.</p>
        </div>
      </div>
      <div id="msg-members" class="msg"></div>
      <div id="members-container"><p class="skeleton">Lade Mitglieder…</p></div>
    </section>

  </main>
</div>

<!-- PLAYER MODAL -->
<div id="player-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="player-modal-title">Spieler hinzufügen</h3>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div id="msg-player-modal" class="msg"></div>
    <form id="form-player">
      <input type="hidden" id="p-id">
      <div class="field">
        <label for="p-name">Ingame-Name *</label>
        <input id="p-name" type="text" required maxlength="40">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="p-role">Rolle/Position</label>
          <input id="p-role" type="text" placeholder="z. B. IGL, Entry, Support" maxlength="30">
        </div>
        <div class="field">
          <label for="p-rank">Rang</label>
          <input id="p-rank" type="text" placeholder="z. B. Diamond II" maxlength="30">
        </div>
      </div>
      <div class="field">
        <label for="p-contact">Kontakt</label>
        <input id="p-contact" type="text" placeholder="Discord, z. B. name#0001" maxlength="60">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="p-kda">Ø KDA</label>
          <input id="p-kda" type="number" step="0.01" min="0" placeholder="1.25">
        </div>
        <div class="field">
          <label for="p-winrate">Winrate %</label>
          <input id="p-winrate" type="number" step="0.1" min="0" max="100" placeholder="54.5">
        </div>
      </div>
      <div class="field">
        <label for="p-notes">Notizen</label>
        <textarea id="p-notes" rows="3" maxlength="500"></textarea>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn btn-primary" id="p-submit">Speichern</button>
      </div>
    </form>
  </div>
</div>

<script src="js/debugBar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
        onerror="window.showDebugError('Supabase-Bibliothek konnte nicht geladen werden (CDN nicht erreichbar).')"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/players.js"></script>
<script src="js/app.js"></script>
</body>
</html>
